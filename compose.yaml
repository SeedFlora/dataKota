services:
  crm-server:
    build:
      context: .
      args:
        EXPORT_MANIFEST_SHA256: ${EXPORT_MANIFEST_SHA256:?set the exporter digest}
    image: crm-multimodal:latest
    container_name: crm-server
    ports:
      - "8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    environment:
      - HF_HOME=/app/.cache/huggingface
      - ORT_PROVIDER=CUDAExecutionProvider
      - EXPORT_MANIFEST_SHA256=${EXPORT_MANIFEST_SHA256:?set the exporter digest}
    volumes:
      - ${EXPORT_DIR_HOST:-./artifacts/export}:/app/artifacts/export:ro
